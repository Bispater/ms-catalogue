# Configuración Nginx para el HOST (no Docker)
# Ubicación: /etc/nginx/sites-available/catalogue.favric.cl
# Symlink: ln -s /etc/nginx/sites-available/catalogue.favric.cl /etc/nginx/sites-enabled/

# Redirigir HTTP a HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name catalogue.favric.cl;
    
    # Redirigir todo a HTTPS
    return 301 https://$server_name$request_uri;
}

# Servidor HTTPS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name catalogue.favric.cl;

    # Certificados SSL (gestionados por Certbot)
    ssl_certificate /etc/letsencrypt/live/catalogue.favric.cl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/catalogue.favric.cl/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Headers de seguridad
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Tamaños máximos
    client_max_body_size 100M;

    # Logs
    access_log /var/log/nginx/catalogue.favric.cl.access.log;
    error_log /var/log/nginx/catalogue.favric.cl.error.log;

    # Archivos estáticos (servidos desde Docker volume)
    location /static/ {
        alias /var/ms-catalogue/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Archivos media (servidos desde Docker volume)
    location /media/ {
        alias /var/ms-catalogue/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Proxy a Django (contenedor Docker en puerto 8000)
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        
        # Timeouts
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }
}
